[package]
name = "ilc-study-tool"
version = "0.1.0"
description = "TVO ILC Study Tool"
authors = ["TVO ILC Team"]
edition = "2021"

[lib]
name = "ilc_study_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
